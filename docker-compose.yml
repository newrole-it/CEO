services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: jobscanner
      POSTGRES_PASSWORD: jobscanner
      POSTGRES_DB: jobscanner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobscanner -d jobscanner"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "43123:43123"
    environment:
      DATABASE_URL: postgresql://jobscanner:jobscanner@db:5432/jobscanner
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-jobscanner-dev-session-secret-key-32b}
      OWNER_EMAIL: ${OWNER_EMAIL:-rafal@jobscanner.local}
      OWNER_NAME: ${OWNER_NAME:-Rafał}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-jobscanner-local}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_INPUT_USD_PER_MILLION: ${LLM_INPUT_USD_PER_MILLION:-}
      LLM_OUTPUT_USD_PER_MILLION: ${LLM_OUTPUT_USD_PER_MILLION:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      SCAN_SEED_LIMIT: ${SCAN_SEED_LIMIT:-40}
      DISCOVERY_QUERY_LIMIT: ${DISCOVERY_QUERY_LIMIT:-8}
      MATCH_SALARY_FLOOR_PLN: ${MATCH_SALARY_FLOOR_PLN:-1}
      MATCH_HOME_CITY: ${MATCH_HOME_CITY:-Warsaw}
      MATCH_HOME_COUNTRY: ${MATCH_HOME_COUNTRY:-PL}
      MATCH_RELOCATION_OK: ${MATCH_RELOCATION_OK:-true}
      FX_EUR_PLN: ${FX_EUR_PLN:-}
      FX_USD_PLN: ${FX_USD_PLN:-}
      FX_GBP_PLN: ${FX_GBP_PLN:-}
      FX_CHF_PLN: ${FX_CHF_PLN:-}
      FX_AS_OF: ${FX_AS_OF:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
