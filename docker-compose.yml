x-app-env: &app-env
  DATABASE_URL: postgresql://jobscanner:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/jobscanner
  SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:?Set SESSION_SECRET_KEY}
  OWNER_EMAIL: ${OWNER_EMAIL:-owner@nowarola.local}
  OWNER_NAME: ${OWNER_NAME:-Owner}
  OWNER_PASSWORD: ${OWNER_PASSWORD:?Set OWNER_PASSWORD}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
  LLM_INPUT_USD_PER_MILLION: ${LLM_INPUT_USD_PER_MILLION:-}
  LLM_OUTPUT_USD_PER_MILLION: ${LLM_OUTPUT_USD_PER_MILLION:-}
  BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
  SERPER_API_KEY: ${SERPER_API_KEY:-}
  SCAN_SEED_LIMIT: ${SCAN_SEED_LIMIT:-40}
  DISCOVERY_QUERY_LIMIT: ${DISCOVERY_QUERY_LIMIT:-14}
  CAREER_DETAIL_LIMIT: ${CAREER_DETAIL_LIMIT:-40}
  CRAWLER_NOTE: ${CRAWLER_NOTE:-}
  CRAWLER_OPT_OUT_HOSTS: ${CRAWLER_OPT_OUT_HOSTS:-}
  OFFER_INDEX: ${OFFER_INDEX:-}
  OPERATOR_NAME: ${OPERATOR_NAME:-}
  OPERATOR_CONTACT: ${OPERATOR_CONTACT:-}
  OPERATOR_PROCESSORS: ${OPERATOR_PROCESSORS:-}
  SMARTRECRUITERS_POSTING_API: ${SMARTRECRUITERS_POSTING_API:-off}
  MATCH_SALARY_FLOOR_PLN: ${MATCH_SALARY_FLOOR_PLN:-1}
  MATCH_ACCEPTED_CONTRACTS: ${MATCH_ACCEPTED_CONTRACTS:-}
  MATCH_HOME_CITY: ${MATCH_HOME_CITY:-Warsaw}
  MATCH_HOME_COUNTRY: ${MATCH_HOME_COUNTRY:-PL}
  MATCH_HYBRID_CITIES: ${MATCH_HYBRID_CITIES:-}
  MATCH_RELOCATION_OK: ${MATCH_RELOCATION_OK:-true}
  FETCH_TIMEOUT_MS: ${FETCH_TIMEOUT_MS:-}
  FETCH_MAX_BYTES: ${FETCH_MAX_BYTES:-}
  FX_EUR_PLN: ${FX_EUR_PLN:-}
  FX_USD_PLN: ${FX_USD_PLN:-}
  FX_GBP_PLN: ${FX_GBP_PLN:-}
  FX_CHF_PLN: ${FX_CHF_PLN:-}
  FX_AS_OF: ${FX_AS_OF:-}
  RECRUITEE_CAREERS_TOKEN: ${RECRUITEE_CAREERS_TOKEN:-}
  APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:43123}
  APP_URL: ${APP_URL:-}
  TRUST_PROXY: ${TRUST_PROXY:-}
  LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
  LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
  LINKEDIN_REDIRECT_URI: ${LINKEDIN_REDIRECT_URI:-}
  GMAIL_TOKEN_KEY: ${GMAIL_TOKEN_KEY:-}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
  EMAIL_FROM: ${EMAIL_FROM:-Nowa Rola <login@jobscanner.local>}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: jobscanner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: jobscanner
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobscanner -d jobscanner"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "127.0.0.1:43123:43123"
    restart: unless-stopped
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: ["npx", "tsx", "src/worker.ts"]
    restart: unless-stopped
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
