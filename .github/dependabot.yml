version: 2
updates:
  # One lockfile at the root covers every npm workspace.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint does not support TypeScript 7 yet, so `npm run lint` fails on it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # eslint-plugin-react, -import and -jsx-a11y (from eslint-config-next) declare ESLint 9 at most.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # Node's built-in fetch rejects an undici 8 Agent ("invalid onRequestStart method", on Node 22
      # and 25), and packages/offers/src/http.ts passes one to it as the dispatcher.
      - dependency-name: undici
        update-types: [version-update:semver-major]
      # The types follow the Node major the project runs on (.nvmrc, CI): 22.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # Tailwind 4 moves its PostCSS plugin to @tailwindcss/postcss and its config from
      # tailwind.config.js into CSS: a change to how every page looks, made on its own (#9).
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
