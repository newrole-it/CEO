version: 2
updates:
  # One lockfile at the root covers every npm workspace.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint does not support TypeScript 7 yet, so `npm run lint` fails on it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # zod 4 breaks the MCP server's tool schemas; moving to it is a change of its own.
      - dependency-name: zod
        update-types: [version-update:semver-major]
      # eslint-plugin-react, -import and -jsx-a11y (from eslint-config-next) declare ESLint 9 at most.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # The Prisma CLI and client move together, and a new major is a migration of its own.
      - dependency-name: prisma
        update-types: [version-update:semver-major]
      - dependency-name: "@prisma/client"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
