name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobscanner
          POSTGRES_PASSWORD: jobscanner
          POSTGRES_DB: jobscanner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobscanner -d jobscanner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://jobscanner:jobscanner@127.0.0.1:5432/jobscanner
      SESSION_SECRET_KEY: ci-only-session-secret-not-used-anywhere-else
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # newrole.it's client goes to the root node_modules; the jobs lab's (@newrole/jobs-lab-db)
      # to its own package. npm ci has generated the lab's already (postinstall); this step shows it.
      # --workspaces --if-present: steps for the lab run when apps/jobs-lab is there and skip when not.
      - run: npx prisma generate --schema apps/resume-engine-optimization/db/schema.prisma
      - run: npm run generate --workspaces --if-present
      # every app's own test database: newrole.it's <db>_test, the lab's <db>_lab_test.
      - run: npm run test:db
      - run: npm run lint
      - run: npm run check:boundaries
      - run: npm run check:i18n
      - run: npm run typecheck
      - run: npm run test:workspaces
      - run: npm run test:extension
      - run: npm run test:flow
      # newrole.it, and the jobs lab when it is there.
      - run: npm run build --workspaces --if-present
