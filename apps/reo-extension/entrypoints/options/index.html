<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="manifest.open_in_tab" content="true" />
    <title data-i18n="options.title">newrole.it</title>
    <link rel="stylesheet" href="../popup/style.css" />
  </head>
  <body class="options">
    <h1 data-i18n="options.heading"></h1>
    <p id="state" class="muted" role="status" data-i18n="popup.checking"></p>

    <section class="card">
      <h2 data-i18n="options.connection"></h2>
      <p class="muted" data-i18n="options.connection.body"></p>
      <div class="row">
        <button id="pair" class="btn" type="button" data-i18n="popup.connect"></button>
        <button
          id="disconnect"
          class="btn alt hidden"
          type="button"
          data-i18n="options.disconnect"
        ></button>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="options.token"></h2>
      <p class="muted" data-i18n="options.token.body"></p>
      <label class="field">
        <span data-i18n="options.token"></span>
        <input
          id="token"
          type="password"
          autocomplete="off"
          spellcheck="false"
          placeholder="nr_…"
        />
      </label>
      <div class="row">
        <button id="test" class="btn" type="button" data-i18n="options.token.check"></button>
      </div>
      <p id="tokenMessage" class="muted hidden" role="status"></p>
    </section>

    <section class="card">
      <h2 data-i18n="options.base"></h2>
      <p class="muted" data-i18n="options.base.body"></p>
      <label class="field">
        <span data-i18n="options.base.label"></span>
        <input id="apiBase" type="url" autocomplete="off" spellcheck="false" />
      </label>
      <div class="row">
        <button id="saveBase" class="btn alt" type="button" data-i18n="options.base.save"></button>
      </div>
      <p id="baseMessage" class="muted hidden" role="status"></p>
    </section>

    <script type="module" src="./main.js"></script>
  </body>
</html>
