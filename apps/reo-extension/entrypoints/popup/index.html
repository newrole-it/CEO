<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>newrole.it</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="popup">
    <header class="head">
      <img src="/icon32.png" width="20" height="20" alt="" />
      <strong>newrole.it</strong>
    </header>

    <p id="state" class="muted" role="status" data-i18n="popup.checking"></p>
    <button id="connect" class="btn hidden" type="button" data-i18n="popup.connect"></button>

    <section id="actions" class="stack hidden">
      <p id="applied" class="applied hidden"></p>
      <p id="profileScore" class="applied hidden"></p>
      <button id="fill" class="btn" type="button" data-i18n="popup.fill"></button>
      <p id="fitLine" class="applied hidden"></p>
      <p id="fitLinks" class="links hidden">
        <a id="fitEditor" href="#" target="_blank" rel="noreferrer noopener"></a>
        <a id="fitMatch" href="#" target="_blank" rel="noreferrer noopener"></a>
      </p>
      <button id="tailor" class="btn hidden" type="button"></button>
      <button id="addOffer" class="btn" type="button" data-i18n="popup.addOffer"></button>
      <button id="save" class="btn alt" type="button" data-i18n="popup.save"></button>
      <button id="audit" class="btn hidden" type="button" data-i18n="popup.audit"></button>
      <button id="readMail" class="btn hidden" type="button" data-i18n="popup.readMail"></button>
      <form id="mailForm" class="stack hidden">
        <p id="mailSubject" class="applied"></p>
        <p id="mailMeta" class="muted"></p>
        <p id="mailReading" class="muted"></p>
        <p id="mailUsed" class="err hidden"></p>
        <label class="field">
          <span data-i18n="popup.mail.app"></span>
          <select id="mailApp" required></select>
        </label>
        <label class="field">
          <span data-i18n="popup.mail.status"></span>
          <select id="mailStatus"></select>
        </label>
        <button id="useMail" class="btn" type="submit" data-i18n="popup.mail.save"></button>
      </form>
      <p id="message" class="muted hidden" role="status"></p>
      <label class="toggle">
        <input id="autoTrack" type="checkbox" aria-describedby="autoTrackHint" />
        <span>
          <span data-i18n="popup.autoTrack"></span>
          <small id="autoTrackHint" class="hint" data-i18n="popup.autoTrack.hint"></small>
        </span>
      </label>
      <label class="toggle">
        <input id="offerCheck" type="checkbox" aria-describedby="offerCheckHint" />
        <span>
          <span data-i18n="popup.offerCheck"></span>
          <small id="offerCheckHint" class="hint" data-i18n="popup.offerCheck.hint"></small>
        </span>
      </label>
      <label class="toggle">
        <input id="linkedinAuto" type="checkbox" aria-describedby="linkedinAutoHint" />
        <span>
          <span data-i18n="popup.linkedinAuto"></span>
          <small id="linkedinAutoHint" class="hint" data-i18n="popup.linkedinAuto.hint"></small>
        </span>
      </label>
      <label class="toggle">
        <input id="allSites" type="checkbox" aria-describedby="allSitesHint" />
        <span>
          <span data-i18n="popup.allSites"></span>
          <small id="allSitesHint" class="hint" data-i18n="popup.allSites.hint"></small>
        </span>
      </label>
      <nav class="links">
        <a
          id="tracker"
          href="#"
          target="_blank"
          rel="noreferrer noopener"
          data-i18n="popup.link.tracker"
        ></a>
        <a
          id="answers"
          href="#"
          target="_blank"
          rel="noreferrer noopener"
          data-i18n="popup.link.answers"
        ></a>
        <a id="options" href="options.html" target="_blank" data-i18n="popup.link.options"></a>
        <a
          id="help"
          href="#"
          target="_blank"
          rel="noreferrer noopener"
          data-i18n="popup.link.help"
        ></a>
      </nav>
    </section>

    <script type="module" src="./main.js"></script>
  </body>
</html>
