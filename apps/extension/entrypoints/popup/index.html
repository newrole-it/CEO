<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>newrole.it</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="popup">
    <header class="head">
      <img src="/icon32.png" width="20" height="20" alt="" />
      <strong>newrole.it</strong>
    </header>

    <p id="state" class="muted" role="status">Sprawdzam połączenie…</p>
    <button id="connect" class="btn hidden" type="button">Połącz z newrole.it</button>

    <section id="actions" class="stack hidden">
      <p id="applied" class="applied hidden"></p>
      <p id="profileScore" class="applied hidden"></p>
      <button id="fill" class="btn" type="button">Wypełnij formularz na tej stronie</button>
      <button id="addOffer" class="btn" type="button">Dodaj tę ofertę do newrole.it</button>
      <button id="save" class="btn alt" type="button">Zapisz tę stronę jako aplikację</button>
      <button id="audit" class="btn hidden" type="button">Oceń ten profil LinkedIn</button>
      <button id="readMail" class="btn hidden" type="button">Użyj tego maila w aplikacji</button>
      <form id="mailForm" class="stack hidden">
        <p id="mailSubject" class="applied"></p>
        <p id="mailMeta" class="muted"></p>
        <p id="mailReading" class="muted"></p>
        <p id="mailUsed" class="err hidden"></p>
        <label class="field">
          Której aplikacji dotyczy
          <select id="mailApp" required></select>
        </label>
        <label class="field">
          Status
          <select id="mailStatus"></select>
        </label>
        <button id="useMail" class="btn" type="submit">Zapisz w trackerze</button>
      </form>
      <p id="message" class="muted hidden" role="status"></p>
      <label class="toggle">
        <input id="autoTrack" type="checkbox" />
        <span>Automatyczne śledzenie wysłanych aplikacji</span>
      </label>
      <label class="toggle">
        <input id="offerCheck" type="checkbox" />
        <span>Pokazuj na ofertach, czy już aplikowano</span>
      </label>
      <label class="toggle">
        <input id="linkedinAuto" type="checkbox" />
        <span>Oceniaj mój profil LinkedIn, gdy go otworzę</span>
      </label>
      <label class="toggle">
        <input id="allSites" type="checkbox" />
        <span>Działaj na wszystkich stronach</span>
      </label>
      <nav class="links">
        <a id="tracker" href="#" target="_blank" rel="noreferrer noopener">Tracker</a>
        <a id="answers" href="#" target="_blank" rel="noreferrer noopener">Baza odpowiedzi</a>
        <a id="options" href="options.html" target="_blank">Opcje</a>
      </nav>
    </section>

    <script type="module" src="./main.js"></script>
  </body>
</html>
